"A datetime string with format `Y-m-d H:i:s`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

enum MonitorType {
    Http
    GraphQL
    Ping
    Tcp
    Dns
    Tls
    Heartbeat
    Udp
    WebSocket
    Mysql
    Redis
    Postgres
}

enum DnsQueryType {
    A
    AAAA
    CNAME
    MX
    NS
    PTR
    SRV
    TXT
}

enum MonitorStatus {
    Pending
    Up
    Down
    Paused
    Maintenance
}

enum IpFamily {
    Ipv4
    Ipv6
    Any
}

enum HttpMethod {
    GET
    POST
    PUT
    PATCH
    DELETE
    HEAD
}

enum NotificationChannelType {
    Mail
    Slack
    MicrosoftTeams
    Discord
    Webhook
    Pagerduty
}

enum AggregateGranularity {
    Hour
    Day
}

type KeyValue {
    key: String!
    value: String!
}

input KeyValueInput {
    key: String!
    value: String!
}

type Probe {
    id: ID!
    slug: String!
    name: String!
    queue: String!
    enabled: Boolean!
    is_default: Boolean!
    created_at: DateTime
    updated_at: DateTime
}

type MonitorCondition {
    id: ID!
    expression: String!
    sort: Int!
}

type CheckResult {
    id: ID!
    success: Boolean!
    latency_ms: Int
    http_status: Int
    resolved_ip: String
    certificate_expires_at: DateTime
    domain_expires_at: DateTime
    message: String
    condition_results: String @method(name: "graphqlConditionResults")
    checked_at: DateTime
    probe: Probe @belongsTo
}

type CheckAggregate {
    id: ID!
    probe_id: ID
    period_start: DateTime!
    granularity: AggregateGranularity!
    up_count: Int!
    down_count: Int!
    avg_latency_ms: Int
}

type MonitorUptime {
    oneHour: Float
    twentyFourHours: Float
    sevenDays: Float
    thirtyDays: Float
}

type MailNotificationChannelConfig {
    to: String!
}

input MailNotificationChannelInput {
    to: String!
}

type SlackNotificationChannelConfig {
    webhookUrl: String!
}

input SlackNotificationChannelInput {
    webhookUrl: String!
}

type MicrosoftTeamsNotificationChannelConfig {
    webhookUrl: String!
}

input MicrosoftTeamsNotificationChannelInput {
    webhookUrl: String!
}

type DiscordNotificationChannelConfig {
    webhookUrl: String!
}

input DiscordNotificationChannelInput {
    webhookUrl: String!
}

type WebhookNotificationChannelConfig {
    url: String!
}

input WebhookNotificationChannelInput {
    url: String!
}

type PagerdutyNotificationChannelConfig {
    routingKey: String!
}

input PagerdutyNotificationChannelInput {
    routingKey: String!
}

type NotificationChannel {
    id: ID!
    name: String!
    type: NotificationChannelType!
    mail: MailNotificationChannelConfig @method(name: "graphqlMail")
    slack: SlackNotificationChannelConfig @method(name: "graphqlSlack")
    microsoftTeams: MicrosoftTeamsNotificationChannelConfig @method(name: "graphqlMicrosoftTeams")
    discord: DiscordNotificationChannelConfig @method(name: "graphqlDiscord")
    webhook: WebhookNotificationChannelConfig @method(name: "graphqlWebhook")
    pagerduty: PagerdutyNotificationChannelConfig @method(name: "graphqlPagerduty")
    created_at: DateTime
    updated_at: DateTime
}

type Monitor {
    id: ID!
    name: String!
    description: String
    tags: [String!]! @method(name: "graphqlTags")
    type: MonitorType!
    enabled: Boolean!
    interval_seconds: Int!
    timeout_seconds: Int!
    ip_family: IpFamily!
    target: String!
    method: HttpMethod
    requestHeaders: [KeyValue!]! @method(name: "graphqlRequestHeaders")
    request_body: String
    dns_query_name: String
    dns_query_type: DnsQueryType
    heartbeat_token: String
    heartbeatUrl: String @method(name: "heartbeatUrl")
    heartbeatStartUrl: String @method(name: "heartbeatStartUrl")
    heartbeatFinishUrl: String @method(name: "heartbeatFinishUrl")
    heartbeatErrorUrl: String @method(name: "heartbeatErrorUrl")
    statusBadgeUrl: String @method(name: "statusBadgeSvgUrl")
    statusBadgeJsonUrl: String @method(name: "statusBadgeJsonUrl")
    uptimeBadgeUrl: String @method(name: "uptimeBadgeSvgUrl")
    uptimeBadgeJsonUrl: String @method(name: "uptimeBadgeJsonUrl")
    latencyBadgeUrl: String @method(name: "latencyBadgeSvgUrl")
    latencyBadgeJsonUrl: String @method(name: "latencyBadgeJsonUrl")
    badgeMarkdown: String @method(name: "badgeMarkdown")
    follow_redirects: Boolean!
    verify_tls: Boolean!
    proxy_url: String
    status: MonitorStatus! @method(name: "effectiveStatus")
    last_checked_at: DateTime
    next_check_at: DateTime
    last_status_changed_at: DateTime
    consecutive_successes: Int!
    consecutive_failures: Int!
    retention_days: Int!
    created_at: DateTime
    updated_at: DateTime
    uptime: MonitorUptime! @method(name: "graphqlUptime")
    conditions: [MonitorCondition!]! @hasMany
    probes: [Probe!]! @belongsToMany
    notificationChannels: [NotificationChannel!]! @belongsToMany
    checks: [CheckResult!]! @hasMany(relation: "checkResults")
    aggregates: [CheckAggregate!]! @hasMany(relation: "checkAggregates")
    activeMaintenanceWindow: MaintenanceWindow @method(name: "activeMaintenanceWindow")
}

input CreateMonitorInput {
    name: String!
    description: String
    tags: [String!]
    type: MonitorType!
    enabled: Boolean = true
    intervalSeconds: Int
    timeoutSeconds: Int
    ipFamily: IpFamily
    target: String!
    method: HttpMethod
    requestHeaders: [KeyValueInput!]
    requestBody: String
    dnsQueryName: String
    dnsQueryType: DnsQueryType
    followRedirects: Boolean
    verifyTls: Boolean
    proxyUrl: String
    retentionDays: Int
    conditions: [String!]
    probeIds: [ID!]
}

input UpdateMonitorInput {
    name: String
    description: String
    tags: [String!]
    type: MonitorType
    enabled: Boolean
    intervalSeconds: Int
    timeoutSeconds: Int
    ipFamily: IpFamily
    target: String
    method: HttpMethod
    requestHeaders: [KeyValueInput!]
    requestBody: String
    dnsQueryName: String
    dnsQueryType: DnsQueryType
    followRedirects: Boolean
    verifyTls: Boolean
    proxyUrl: String
    retentionDays: Int
    conditions: [String!]
    probeIds: [ID!]
}

input CreateNotificationChannelInput {
    name: String!
    type: NotificationChannelType!
    mail: MailNotificationChannelInput
    slack: SlackNotificationChannelInput
    microsoftTeams: MicrosoftTeamsNotificationChannelInput
    discord: DiscordNotificationChannelInput
    webhook: WebhookNotificationChannelInput
    pagerduty: PagerdutyNotificationChannelInput
}

input UpdateNotificationChannelInput {
    name: String
    type: NotificationChannelType
    mail: MailNotificationChannelInput
    slack: SlackNotificationChannelInput
    microsoftTeams: MicrosoftTeamsNotificationChannelInput
    discord: DiscordNotificationChannelInput
    webhook: WebhookNotificationChannelInput
    pagerduty: PagerdutyNotificationChannelInput
}

type MaintenanceWindow {
    id: ID!
    title: String!
    message: String
    starts_at: DateTime!
    ends_at: DateTime
    applies_to_all: Boolean!
    cancelled_at: DateTime
    phase: String! @method(name: "phase")
    created_at: DateTime
    updated_at: DateTime
    monitors: [Monitor!]! @belongsToMany
}

input CreateMaintenanceWindowInput {
    title: String!
    message: String
    startsAt: DateTime
    endsAt: DateTime
    appliesToAll: Boolean
    monitorIds: [ID!]
}

input UpdateMaintenanceWindowInput {
    title: String
    message: String
    startsAt: DateTime
    endsAt: DateTime
    appliesToAll: Boolean
    monitorIds: [ID!]
}

type Query @guard(with: ["sanctum"]) {
    monitor(id: ID! @eq): Monitor @find
    monitors(tag: String @whereJsonContains(key: "tags")): [Monitor!]! @all
    notificationChannel(id: ID! @eq): NotificationChannel @find
    notificationChannels: [NotificationChannel!]! @all
    probes: [Probe!]! @all
    maintenanceWindow(id: ID! @eq): MaintenanceWindow @find
    maintenanceWindows: [MaintenanceWindow!]! @all
    statusPage(id: ID! @eq): StatusPage @find
    statusPages: [StatusPage!]! @all
    incident(id: ID! @eq): Incident @find
}

enum StatusPageTheme {
    Dark
    Light
}

enum StatusPageHealth {
    Operational
    Degraded
    PartialOutage
    MajorOutage
    Maintenance
}

enum IncidentStatus {
    Investigating
    Identified
    Monitoring
    Resolved
    Scheduled
}

enum IncidentImpact {
    None
    Minor
    Major
    Critical
}

type StatusPageListing @model(class: "App\\Models\\StatusPageMonitor") {
    id: ID!
    public_name: String
    sort: Int!
    monitor: Monitor @belongsTo
}

type IncidentUpdate {
    id: ID!
    status: IncidentStatus!
    message: String!
    posted_at: DateTime
}

type Incident {
    id: ID!
    title: String!
    status: IncidentStatus!
    impact: IncidentImpact!
    started_at: DateTime
    resolved_at: DateTime
    created_at: DateTime
    updated_at: DateTime
    statusPage: StatusPage @belongsTo
    updates: [IncidentUpdate!]! @hasMany
    monitors: [Monitor!]! @belongsToMany
}

type StatusPage {
    id: ID!
    name: String!
    slug: String!
    custom_domain: String
    headline: String
    description: String
    logo_url: String
    favicon_url: String
    footer_text: String
    custom_css: String
    theme: StatusPageTheme!
    published: Boolean!
    show_targets: Boolean!
    passwordProtected: Boolean! @method(name: "isPasswordProtected")
    refresh_seconds: Int!
    pathUrl: String! @method(name: "pathUrl")
    publicUrl: String! @method(name: "publicUrl")
    health: StatusPageHealth! @method(name: "health")
    created_at: DateTime
    updated_at: DateTime
    listings: [StatusPageListing!]! @hasMany
    monitors: [Monitor!]! @belongsToMany
    incidents: [Incident!]! @hasMany
}

input StatusPageMonitorInput {
    monitorId: ID!
    publicName: String
}

input CreateStatusPageInput {
    name: String!
    slug: String!
    customDomain: String
    headline: String
    description: String
    logoUrl: String
    faviconUrl: String
    footerText: String
    customCss: String
    theme: StatusPageTheme = Dark
    published: Boolean = false
    showTargets: Boolean = false
    password: String
    refreshSeconds: Int
    monitorIds: [ID!]
    monitors: [StatusPageMonitorInput!]
}

input UpdateStatusPageInput {
    name: String
    slug: String
    customDomain: String
    headline: String
    description: String
    logoUrl: String
    faviconUrl: String
    footerText: String
    customCss: String
    theme: StatusPageTheme
    published: Boolean
    showTargets: Boolean
    password: String
    refreshSeconds: Int
    monitorIds: [ID!]
    monitors: [StatusPageMonitorInput!]
}

input CreateIncidentInput {
    statusPageId: ID!
    title: String!
    status: IncidentStatus = Investigating
    impact: IncidentImpact = Minor
    message: String
    startedAt: DateTime
    resolvedAt: DateTime
    monitorIds: [ID!]
}

input UpdateIncidentInput {
    title: String
    status: IncidentStatus
    impact: IncidentImpact
    startedAt: DateTime
    resolvedAt: DateTime
    monitorIds: [ID!]
}

input AddIncidentUpdateInput {
    status: IncidentStatus
    message: String!
    postedAt: DateTime
}

type Mutation @guard(with: ["sanctum"]) {
    createMonitor(input: CreateMonitorInput!): Monitor!
    updateMonitor(id: ID!, input: UpdateMonitorInput!): Monitor!
    deleteMonitor(id: ID!): Boolean!
    createNotificationChannel(input: CreateNotificationChannelInput!): NotificationChannel!
    updateNotificationChannel(id: ID!, input: UpdateNotificationChannelInput!): NotificationChannel!
    deleteNotificationChannel(id: ID!): Boolean!
    syncMonitorChannels(monitorId: ID!, channelIds: [ID!]!): Monitor!
    createMaintenanceWindow(input: CreateMaintenanceWindowInput!): MaintenanceWindow!
    updateMaintenanceWindow(id: ID!, input: UpdateMaintenanceWindowInput!): MaintenanceWindow!
    endMaintenanceWindow(id: ID!): MaintenanceWindow!
    deleteMaintenanceWindow(id: ID!): Boolean!
    startMonitorMaintenance(monitorId: ID!, title: String, message: String, endsAt: DateTime): MaintenanceWindow!
    endMonitorMaintenance(monitorId: ID!): Monitor!
    createStatusPage(input: CreateStatusPageInput!): StatusPage!
    updateStatusPage(id: ID!, input: UpdateStatusPageInput!): StatusPage!
    deleteStatusPage(id: ID!): Boolean!
    createIncident(input: CreateIncidentInput!): Incident!
    updateIncident(id: ID!, input: UpdateIncidentInput!): Incident!
    deleteIncident(id: ID!): Boolean!
    addIncidentUpdate(incidentId: ID!, input: AddIncidentUpdateInput!): Incident!
}
