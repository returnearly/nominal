services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: returnearly/nominal:local
    environment:
      APP_NAME: Nominal
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}
      CONTAINER_ROLE: app
      PROBE_REGION: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: nominal
      REVERB_APP_KEY: ${REVERB_APP_KEY:-nominal-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-nominal-secret}
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - ./database/database.sqlite:/app/database/database.sqlite
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    image: returnearly/nominal:local
    cap_add:
      - NET_RAW
    environment:
      APP_NAME: Nominal
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}
      CONTAINER_ROLE: worker
      PROBE_REGION: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: nominal
      REVERB_APP_KEY: ${REVERB_APP_KEY:-nominal-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-nominal-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - ./database/database.sqlite:/app/database/database.sqlite
    depends_on:
      - redis
      - app

  scheduler:
    image: returnearly/nominal:local
    environment:
      APP_NAME: Nominal
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      CONTAINER_ROLE: scheduler
      PROBE_REGION: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - ./database/database.sqlite:/app/database/database.sqlite
    depends_on:
      - redis
      - app

  reverb:
    image: returnearly/nominal:local
    environment:
      APP_NAME: Nominal
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      CONTAINER_ROLE: reverb
      REDIS_HOST: redis
      REVERB_APP_ID: nominal
      REVERB_APP_KEY: ${REVERB_APP_KEY:-nominal-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-nominal-secret}
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
